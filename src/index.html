<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brone</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/lib/anime.min.js"></script>
</head>
<body>
  <svg id="wajah" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet">
    <!-- Layer 0: Backside (Frame garis wajah & antena) -->
    <g id="layer-backside"></g>

    <!-- Layer 1: Blush pipi (di bawah mata) -->
    <g id="layer-blush">
      <image id="blush-l" href="" style="display: none;" />
      <image id="blush-r" href="" style="display: none;" />
    </g>

    <!-- Layer 2: Mulut (Viseme / Ekspresi) -->
    <g id="layer-mouth">
      <image id="mouth" href="" />
    </g>

    <!-- Layer 3: Mata Kiri & Kanan (dengan kedip) -->
    <g id="layer-eyes">
      <g id="eye-l-wrap" class="anim-eye">
        <image id="eye-l" href="" />
      </g>
      <g id="eye-r-wrap" class="anim-eye">
        <image id="eye-r" href="" />
      </g>
    </g>

    <!-- Layer 4: Air Mata (DI DEPAN MATA - Sesuai spesifikasi F-09) -->
    <g id="layer-tears">
      <defs>
        <clipPath id="tear-l-clip">
          <rect id="tear-l-clip-rect" x="110" y="207" width="135" height="280" />
        </clipPath>
        <clipPath id="tear-r-clip">
          <rect id="tear-r-clip-rect" x="555" y="207" width="135" height="280" />
        </clipPath>
        <clipPath id="tear-l-anchor-clip">
          <rect id="tear-l-anchor-rect" x="110" y="207" width="135" height="35" />
        </clipPath>
        <clipPath id="tear-r-anchor-clip">
          <rect id="tear-r-anchor-rect" x="555" y="207" width="135" height="35" />
        </clipPath>
      </defs>

      <!-- Air mata kiri: aliran air mengalir ke bawah -->
      <g id="tear-l-container" clip-path="url(#tear-l-clip)">
        <g id="tear-l-wrap" class="anim-tear">
          <image id="tear-l-1" href="" style="display: none;" />
          <image id="tear-l-2" href="" style="display: none;" />
          <image id="tear-l-3" href="" style="display: none;" />
        </g>
      </g>
      <!-- Pangkal air mata kiri (menempel di kelopak mata) -->
      <g clip-path="url(#tear-l-anchor-clip)">
        <image id="tear-l-anchor" href="" style="display: none;" />
      </g>

      <!-- Air mata kanan: aliran air mengalir ke bawah -->
      <g id="tear-r-container" clip-path="url(#tear-r-clip)">
        <g id="tear-r-wrap" class="anim-tear">
          <image id="tear-r-1" href="" style="display: none;" />
          <image id="tear-r-2" href="" style="display: none;" />
          <image id="tear-r-3" href="" style="display: none;" />
        </g>
      </g>
      <!-- Pangkal air mata kanan (menempel di kelopak mata) -->
      <g clip-path="url(#tear-r-anchor-clip)">
        <image id="tear-r-anchor" href="" style="display: none;" />
      </g>
    </g>

    <!-- Layer 5: Efek Overlay (Tanda Seru / Tanda Tanya melayang) -->
    <g id="layer-effects">
      <image id="effect-sym" href="" style="display: none;" />
    </g>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
